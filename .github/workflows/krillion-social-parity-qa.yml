name: Krillion Social and Visual Parity QA
on:
  push:
    branches:
      - feature/krillion-visual-social-parity-20261030
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Regression tests
        run: npm test
      - name: Client-side syntax
        run: |
          for script in public/play/deep-dive/{game.js,party.js,reference-social.js,reference-source-navigation.js,reference-interface.js,reference-boot.js,reference-sound.js}; do
            node --check "$script"
          done
